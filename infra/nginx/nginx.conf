# nginx — borde de la plataforma: termina TLS en 443 y hace reverse proxy
# hacia el API Gateway. Es el ÚNICO componente expuesto al host.
#
# Certificados (dev): generar autofirmados en infra/nginx/certs/ como
# server.crt y server.key (ver README). En prod usar certificados reales.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;

  # 80 → 443 (redirección)
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # 443 (TLS) → API Gateway
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Cabeceras de seguridad básicas
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Toda la API entra por /api/ y se reenvía al gateway
    location /api/ {
      proxy_pass         http://gateway:3000/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
